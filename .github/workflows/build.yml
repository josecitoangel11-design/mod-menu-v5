
name: Construir APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential libstdc++6 \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake \
            libffi-dev libssl-dev \
            autopoint gettext

      - name: Configurar python-for-android estable
        run: |
          sed -i '/^\[app\]/a p4a.branch = master' buildozer.spec

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.6.0
          pip install cython==0.29.34

      - name: Construir APK
        run: |
          yes | buildozer -v android debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-Control-APK
          path: bin/*.apk
          if-no-files-found: error
