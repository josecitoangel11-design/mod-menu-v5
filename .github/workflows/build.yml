name:       - name: Aceptar licencias del SDK de Buildozer
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK/licenses"
          yes | sdkmanager --sdk_root="$SDK" --licenses || true
          sdkmanager --sdk_root="$SDK" "build-tools;37.0.0"

      - name: Construir APK
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROIDSDK="$ANDROID_HOME"
          buildozer android debug